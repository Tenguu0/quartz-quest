<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:,">
<title>Quartz Quest — a crystal-hunting puzzle platformer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0a1a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .touch-btn {
    position: fixed; bottom: 18px; z-index: 5; width: 64px; height: 64px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.45); background: rgba(120,90,220,.35); color: #fff;
    font-size: 26px; display: none; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; touch-action: none; font-family: system-ui, sans-serif;
  }
  .touch-btn:active { background: rgba(160,120,255,.6); }
  #btn-left { left: 18px; }
  #btn-right { left: 96px; }
  #btn-jump { right: 18px; width: 76px; height: 76px; font-size: 30px; }
  body.touch .touch-btn { display: flex; }
</style>
</head>
<body>
<canvas id="game" aria-label="Quartz Quest: a puzzle platformer. Collect every quartz crystal, dodge spikes and slimes, and reach the portal."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<button class="touch-btn" id="btn-left" aria-label="Move left">&#8592;</button>
<button class="touch-btn" id="btn-right" aria-label="Move right">&#8594;</button>
<button class="touch-btn" id="btn-jump" aria-label="Jump">&#8593;</button>
<script type="module" src="./src/main.js"></script>
</body>
</html>
